<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>PERCUSSION SYNTHESIZER</title>
<meta name="description" content="Eight-voice 4-operator FM percussion synthesizer with a 1&#x2013;64 step sequencer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;600&display=swap"></noscript>
<style>
body{margin:0}
:root{--bg:#ffffff;--fg:#000000;--cw:17px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--fg:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--fg:#ffffff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font:300 11px/1.4 "Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;padding:0 0 48px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable=""],[contenteditable="true"],[contenteditable="plaintext-only"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body>header,body>section{padding-inline:16px}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--fg);padding:4px 8px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;border-radius:0;line-height:1.3;white-space:nowrap}
button.counting{position:relative}
button.counting>.countdown-label{visibility:hidden}
button.counting::after{content:attr(data-countdown);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:inherit;font-size:var(--countdown-size,11px);letter-spacing:0;font-variant-numeric:tabular-nums;pointer-events:none}
button.on{background:var(--fg);color:var(--bg)}
button.press-dark{background:var(--fg);color:var(--bg)}
button.press-light{background:var(--bg);color:var(--fg)}
button:disabled{cursor:default;text-decoration:line-through}
:focus{outline:none}
.kbd :focus-visible{outline:1px solid var(--fg);outline-offset:2px}
input{font:inherit;color:var(--fg);background:var(--bg);border:0;border-bottom:1px solid var(--fg);border-radius:0;padding:1px 2px;outline:none;width:100%}
.u{text-transform:uppercase;letter-spacing:.09em}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px;border-bottom:1px solid var(--fg)}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp>.cap{text-transform:uppercase;letter-spacing:.12em;margin-right:2px}
.seg{display:flex}
.seg button+button{border-left:0}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;touch-action:pan-y;user-select:none;-webkit-user-select:none}
header.bar>.header-dials{flex:0 0 100%}
.brand{display:flex;flex-direction:column;gap:1px;flex:0 0 100%;min-width:0;position:relative;padding-bottom:12px}
.brand::after{content:"";position:absolute;left:-16px;right:-16px;bottom:0;height:1px;background:var(--fg);pointer-events:none}
.brand b{font:inherit;font-size:16px;font-weight:700;letter-spacing:.07em;line-height:1.3;text-transform:uppercase}
.brand span{letter-spacing:.1em;text-transform:uppercase;font-size:10px}
#scope{width:180px;height:34px;border:1px solid var(--fg);display:block}
.status{min-width:12ch}

/* line slider */
.p{display:grid;grid-template-columns:1fr auto;column-gap:8px;cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:pan-y pinch-zoom;padding-block:3px 1px;min-width:0}
.p .l{text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .v{font-variant-numeric:tabular-nums;cursor:text;white-space:nowrap}
.p .v input{width:8ch;text-align:right;padding:0}
.p .t{grid-column:1/-1;height:9px;position:relative}
.p .t::before{content:"";position:absolute;left:0;right:0;top:4px;border-top:1px dotted var(--fg)}
.p .t b{position:absolute;top:4px;border-top:1px solid var(--fg);height:0}
.p .t i{position:absolute;top:0;width:1px;height:9px;background:var(--fg);margin-left:-.5px}
.p.dis .l{text-decoration:line-through}
.p.inline{width:150px}

/* knob */
.knob{display:flex;align-items:center;gap:6px;cursor:ns-resize;user-select:none;-webkit-user-select:none;touch-action:none}
.knob svg{display:block;overflow:visible}
.knob .kv{display:flex;flex-direction:column;line-height:1.25}
.knob .kv b{font-weight:400;font-variant-numeric:tabular-nums;font-size:13px}

/* numeric field */
.num{display:inline-flex;align-items:stretch}
.num button{padding:1px 5px}
.num span{min-width:3.2ch;text-align:center;border-block:1px solid var(--fg);padding:1px 3px;cursor:ns-resize;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;touch-action:none;line-height:1.55}
.num span.fixed{cursor:default}
.num span input{width:3ch;border:0;text-align:center;padding:0}

/* sequencer */
#seq{padding-block:14px 16px;border-bottom:1px solid var(--fg);width:100%;min-width:0;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.seqcontent{width:max-content;min-width:100%}
.seqtop{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:12px}
.rows{padding-block:6px 4px}
.row{display:flex;align-items:center;gap:0;min-width:max-content;padding-block:4px}
.row .name{width:104px;text-align:left;overflow:hidden;text-overflow:ellipsis}
.row .name.hit{background:var(--fg);color:var(--bg)}
.row .name.on.hit{background:var(--bg);color:var(--fg)}
.row .sm{padding:4px 5px;min-width:22px}
.row .sm.pp,#transportPingPong{padding:4px 5px;display:inline-flex;align-items:center;justify-content:center;height:24px}
#transportPingPong{height:auto}
.random-pp{display:inline-flex;align-items:center;justify-content:center;padding:4px 5px}
.random-pp svg{flex:none}
.row>button,.row>.num{flex-shrink:0}
.row .step-rotate{height:28px;display:inline-flex;align-items:center;justify-content:center}
/* A continuous strip: row controls, arrows and steps share single borders. */
.row>button,.row>.num,.row .sm.pp{height:28px}
.row>button+button,.row>.num,.row>.step-rotate{margin-left:-1px}
.row .num span,.seqtop .num span{display:flex;align-items:center;justify-content:center}
.seqtop .grp{gap:0}
.seqtop .grp>.cap{margin-right:8px}
.seqtop .num,.seqtop button{height:24px}
#lengthDivide,#lengthDivide+.seg{margin-left:-1px}
.steps{display:flex;margin-left:-1px;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.cell{flex:0 0 var(--cw);height:28px;border:1px solid var(--fg);margin-left:-1px;position:relative;cursor:pointer;background:var(--bg)}
.cell:first-child{margin-left:0}
.cell b{position:absolute;left:0;right:0;bottom:0;background:var(--fg);pointer-events:none}
.cell.now::after{content:"";position:absolute;left:-1px;right:-1px;height:1px;background:var(--fg);bottom:-5px}
.hint{letter-spacing:.04em;align-self:center}

/* editor */
#editor{padding-block:16px}
.edhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.edhead .nm{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;width:13ch}
.edhead .idx{font-size:15px;letter-spacing:.1em}
.sec{position:relative;padding-top:9px}
.sec::before{content:"";position:absolute;top:0;left:-16px;right:-16px;height:1px;background:var(--fg);pointer-events:none}
.sec>h3{margin:0 0 8px;font:400 10px/1.4 inherit;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:center}
.edgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
.pgrid .full{grid-column:1/-1}
.ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.op .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
canvas.env{width:100%;height:54px;display:block;border:1px solid var(--fg);margin-bottom:8px}
.mx{display:grid;grid-template-columns:auto repeat(4,1fr) 12px 1fr;gap:4px;align-items:stretch}
.mx .hd{text-align:center;letter-spacing:.1em;padding-block:2px}
.mx .rh{padding-right:6px;align-self:center;letter-spacing:.1em}
.mc{border:1px dotted var(--fg);height:30px;position:relative;cursor:ns-resize;user-select:none;-webkit-user-select:none;touch-action:pan-y pinch-zoom;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mc.nz{border-style:solid}
.mc.fb::before{content:"fb";position:absolute;left:3px;top:1px;font-size:9px;letter-spacing:.05em}
.mc b{position:absolute;left:0;bottom:0;height:1px;background:var(--fg)}
.algs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.algs button{padding:3px 6px;font-size:10px;letter-spacing:.03em;text-transform:none}
.note{margin-top:8px;letter-spacing:.03em}
.ctrlrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

@media (max-width:1100px){.ops{grid-template-columns:repeat(2,minmax(0,1fr))}.edgrid{grid-template-columns:1fr}}
@media (max-width:620px){.ops{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#scope{width:120px}.row .name{width:78px}}
@media (prefers-reduced-motion:reduce){.row .name.hit{background:var(--bg);color:var(--fg);text-decoration:underline}}

.step-group{min-width:0;max-width:100%}#div{flex-wrap:wrap}#div button{flex-shrink:0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>

</head>
<body>
<header class="bar" id="top">
  <div class="brand"><b>PERCUSSION SYNTHESIZER</b></div>
  <div class="grp">
    <button id="play" class="u" style="min-width:64px">Play</button>
    <div id="bpm" class="p inline" style="width:200px" title="Tempo &#x2212;999 to 999. Negative plays the pattern backwards; 0 holds."></div>
    <div class="seg"><button id="flip" class="sm" title="Flip direction 90 &#x2194; &#x2212;90 (F). While playing it waits for the end of the loop; press again to cancel.">Flip</button><button id="transportPingPong" class="sm pp" type="button" aria-label="Ping-pong playback" aria-pressed="false" title="Ping-pong: bounce between the first and last steps without repeating either endpoint. Measure-based controls keep their normal timing. Turning this off keeps the current direction."></button></div>
  </div>
  <div class="grp step-group"><span class="cap">Step</span><div class="seg" id="div"></div></div>
  <div class="grp header-dials">
    <div id="swing" class="knob" title="Swing amount. 0% is straight timing. Double-click to reset."></div>
    <div id="humanize" class="knob" title="Per-note timing variation: 0% is exact; 100% is up to 35 ms early or late, reduced for tightly spaced notes. Double-click to reset."></div>
    <div id="master" class="knob" title="Master output level. Double-click to reset."></div>
  </div>
</header>

<section class="bar" id="audio-monitor" aria-label="Audio quality and output">
  <div class="grp"><span class="cap">Oversample</span><div class="seg" id="os"></div></div>
  <div class="grp"><canvas id="scope" aria-label="Output oscilloscope"></canvas><span id="fmtinfo" class="status"></span></div>
</section>

<section class="bar">
  <div class="grp"><span class="cap">Randomize</span></div>
  <div class="grp"><div class="seg"><button id="rndSounds">Sounds</button><button id="rndSoundsPing" class="random-pp" type="button" aria-label="Sounds undo ping-pong" aria-pressed="false"></button><button type="button" data-random-mode="sounds" data-random-measures="1" aria-label="Sounds: alternate every 1 measure">1</button><button type="button" data-random-mode="sounds" data-random-measures="2" aria-label="Sounds: alternate every 2 measures">2</button><button type="button" data-random-mode="sounds" data-random-measures="3" aria-label="Sounds: alternate every 3 measures">3</button><button type="button" data-random-mode="sounds" data-random-measures="4" aria-label="Sounds: alternate every 4 measures">4</button></div><div id="kWild" class="knob"></div></div>
  <div class="grp"><div class="seg"><button id="rndBeats">Beats</button><button id="rndBeatsPing" class="random-pp" type="button" aria-label="Beats undo ping-pong" aria-pressed="false"></button><button type="button" data-random-mode="beats" data-random-measures="1" aria-label="Beats: alternate every 1 measure">1</button><button type="button" data-random-mode="beats" data-random-measures="2" aria-label="Beats: alternate every 2 measures">2</button><button type="button" data-random-mode="beats" data-random-measures="3" aria-label="Beats: alternate every 3 measures">3</button><button type="button" data-random-mode="beats" data-random-measures="4" aria-label="Beats: alternate every 4 measures">4</button></div><div id="kDens" class="knob"></div></div>
  <div class="grp"><div class="seg"><button id="rndBoth">Both</button><button id="rndBothPing" class="random-pp" type="button" aria-label="Sounds and beats undo ping-pong" aria-pressed="false"></button><button type="button" data-random-mode="both" data-random-measures="1" aria-label="Both: alternate every 1 measure">1</button><button type="button" data-random-mode="both" data-random-measures="2" aria-label="Both: alternate every 2 measures">2</button><button type="button" data-random-mode="both" data-random-measures="3" aria-label="Both: alternate every 3 measures">3</button><button type="button" data-random-mode="both" data-random-measures="4" aria-label="Both: alternate every 4 measures">4</button></div></div>
  <div class="grp"><button id="undo">Undo</button></div>
  <div class="grp"><div id="kShortenDelay" class="knob" title="Shorten every instrument's decay tail, including during evolution. 1x is full length; 0.1x is one tenth. Double-click to reset."></div><div class="seg"><button id="delayAutoReturn" class="delay-auto" type="button" aria-pressed="false" title="Return Decay to 1x after releasing the knob or after the 0.1x glide completes.">AUTO RETURN</button><button id="delayToMinimum" class="delay-auto" type="button" title="Glide Decay to 0.1x just after this pattern ends. With Auto return on, glide back to 1x over the following pattern." aria-label="Reduce Decay to 0.1 times just after this pattern ends">0.1&#x00D7;</button></div></div>
  <div class="grp"><div class="seg"><button id="evolve" aria-pressed="false">Evolution</button><button id="evolveFast" aria-pressed="false" aria-label="10 times evolution and devolution speed" title="Run evolution and devolution at ten times the Speed dial's rate.">10&#x00D7;</button></div><div id="kEvolve" class="knob" title="Linear evolution and devolution speed: 50% runs at half the rate of 100%; 0% pauses sound changes."></div><div class="seg" id="evolutionLoop" role="group" aria-label="Automatic devolution"><button id="devolve" aria-pressed="false" disabled>Devolution</button><button id="evolutionPing" class="random-pp" type="button" aria-label="Evolution and devolution ping-pong" aria-pressed="false"></button><button type="button" data-evolution-measures="1" aria-label="1 measure before devolution">1</button><button type="button" data-evolution-measures="2" aria-label="2 measures before devolution">2</button><button type="button" data-evolution-measures="3" aria-label="3 measures before devolution">3</button><button type="button" data-evolution-measures="4" aria-label="4 measures before devolution">4</button></div></div>
</section>

<section class="bar" id="voice-modes" aria-label="Voice modes">
  <div class="grp"><span class="cap">Voices</span><div class="seg" id="vmode"></div></div>
</section>

<section id="seq" tabindex="0" role="region" aria-label="Step sequencer">
  <div class="seqcontent">
  <div class="seqtop">
    <div class="grp"><span class="cap">STEPS</span><span class="num" id="lenAll"></span><div class="seg" id="lengthDivide"></div><div class="seg"><button id="autoReturn" class="on" aria-pressed="true">ESC</button><button id="randomPingPause" class="random-pp" type="button" aria-label="Hold randomization ping-pong during divisors" aria-pressed="false"></button><button id="clear">Clear</button><button id="patternShift" class="random-pp" type="button" aria-label="Automatically shift patterns up one track" aria-pressed="false"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="1"><path d="M7 11.5V0.5M3.5 4L7 0.5L10.5 4"/></svg></button><button id="patternShiftDown" class="random-pp" type="button" aria-label="Automatically shift patterns down one track" aria-pressed="false"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="1"><path d="M7 0.5V11.5M3.5 8L7 11.5L10.5 8"/></svg></button><button id="stepRotateLeft" class="random-pp timed" type="button" aria-label="Shift all patterns one step left"></button><button id="stepRotateRight" class="random-pp timed" type="button" aria-label="Shift all patterns one step right"></button><button type="button" data-shift-measures="1" aria-label="Shift patterns every 1 measure">1</button><button type="button" data-shift-measures="2" aria-label="Shift patterns every 2 measures">2</button><button type="button" data-shift-measures="3" aria-label="Shift patterns every 3 measures">3</button><button type="button" data-shift-measures="4" aria-label="Shift patterns every 4 measures">4</button></div></div>
  </div>
  <div class="rows" id="rows"></div>
  </div>
</section>

<section class="bar">
  <div class="grp"><span class="cap">Export WAV</span><span>loops</span><span class="num" id="loops"></span></div>
  <div class="grp"><div class="seg" id="xrate"></div><div class="seg" id="xbits"></div></div>

  <div class="grp"><button id="export">Export</button><span id="xstat" class="status"></span></div>
  <div class="grp"><span class="cap">Kit</span><div class="seg"><button id="saveKit">Save</button><button id="loadKit">Load</button><button id="defaultKit" title="Load the acoustic default sounds and mix, keeping your patterns and tempo. Undo restores the previous sounds.">Default</button></div><input type="file" id="kitFile" accept=".json,application/json" hidden></div>
  <div class="grp"><div class="seg"><button id="saveAll" title="Save every sound, pattern, global control, automation setting, and WAV option.">Save All Parameters</button><button id="loadAll" title="Restore a full save, paused and ready to Play.">Load All</button></div><input type="file" id="sessionFile" accept=".json,application/json" hidden></div>
</section>

<section id="editor"></section>

<script type="text/plain" id="engine-src">// FM percussion engine (AudioWorklet)
// 64-bit float DSP, 4-operator full-matrix FM, oversampled with Kaiser-windowed FIR decimation,
// sample-accurate sequencer. Sine operators only.
const TAU = Math.PI * 2;
const VEL = [0, 0.2, 0.45, 0.7, 1];
const CR = 16;      // control-rate interval, in oversampled samples
const SOFT = 24;    // regular voices per track
const MAXV = 32;    // + 8 reserve slots that let a stolen voice fade out instead of clicking

function i0(x) {
  let s = 1, t = 1;
  for (let k = 1; k < 60; k++) { t *= (x / (2 * k)) * (x / (2 * k)); s += t; if (t < 1e-14 * s) break; }
  return s;
}
function makeFir(os) {
  if (os < 2) return null;
  const taps = 64 * os - 1, M = taps - 1, fc = 0.5 / os, beta = 9, ib = i0(beta);
  const h = new Float64Array(taps);
  let s = 0;
  for (let n = 0; n < taps; n++) {
    const x = n - M / 2;
    const sinc = x === 0 ? 2 * fc : Math.sin(TAU * fc * x) / (Math.PI * x);
    const r = 2 * n / M - 1;
    h[n] = sinc * i0(beta * Math.sqrt(Math.max(0, 1 - r * r))) / ib;
    s += h[n];
  }
  for (let n = 0; n < taps; n++) h[n] /= s;
  return h;
}
function envAt(op, t, ds) {
  const a = op.a;
  if (t < a) return t / a;
  t -= a;
  if (t < op.h) return 1;
  t -= op.h;
  const k = Math.pow(2, op.curve * 3), br = op.brk;
  const d1 = Math.max(0.05, op.d1 * ds);
  if (t < d1) return br + (1 - br) * Math.pow(1 - t / d1, k);
  t -= d1;
  const d2 = Math.max(0.05, op.d2 * ds);
  if (t < d2) return br * Math.pow(1 - t / d2, k);
  return 0;
}

const N = (x, d, lo, hi) => { x = typeof x === 'number' && isFinite(x) ? x : d; return lo != null && x < lo ? lo : hi != null && x > hi ? hi : x; };
const OPD = { ratio: 1, fine: 0, det: 0, hz: 1000, lvl: 1, a: 0, h: 0, d1: 150, brk: 0.3, d2: 300, curve: 0.5, vel: 0.5, pe: 1, phase: 0 };
const OPLO = { lvl: 0, a: 0, h: 0, d1: 0.05, d2: 0.05, hz: 0.1 };
// Make any incoming state safe for the DSP: finite numbers, full 4x4 matrix, four operators, 64 steps in 0..4.
function cleanState(s) {
  s.bpm = N(s.bpm, 90, -999, 999); s.spb = N(s.spb, 4, 0.01, 8); s.swing = N(s.swing, 0, 0, 1); s.humanize = N(s.humanize, 0, 0, 100);
  s.master = N(s.master, 0.5, 0, 4); s.lengthDivisor = N(s.lengthDivisor, 1, 1, 16); s.os = N(s.os, 2, 1, 4);
  s.decayMultiplier = N(s.decayMultiplier, 1, 0.1, 1);
  s.decayAutoReturn = !!s.decayAutoReturn; s.decaySeq = Math.floor(N(s.decaySeq, 0, 0, Number.MAX_SAFE_INTEGER));
  s.transportPingPong = !!s.transportPingPong;
  s.randomPingDivisorHold = !!s.randomPingDivisorHold;
  s.patternShift = !!s.patternShift;
  s.patternShiftDirection = s.patternShiftDirection === 'down' ? 'down' : 'up';
  s.patternShiftMeasures = [1,2,3,4].includes(s.patternShiftMeasures) ? s.patternShiftMeasures : 1;
  if (!Array.isArray(s.tracks)) s.tracks = [];
  while (s.tracks.length < 8) s.tracks.push({});
  for (let t = 0; t < 8; t++) {
    const tr = s.tracks[t] = (s.tracks[t] && typeof s.tracks[t] === 'object') ? s.tracks[t] : {};
    tr.note = N(tr.note, 100, 1); tr.pAmt = N(tr.pAmt, 0); tr.pDec = N(tr.pDec, 40, 0.01); tr.pCurve = N(tr.pCurve, 0.5, -1, 1);
