<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Strike Eight</title>
<meta name="description" content="Eight-voice 4-operator FM percussion synthesizer with a 1–64 step sequencer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;600&display=swap">
<style>
body{margin:0}
:root{--bg:#ffffff;--fg:#000000;--cw:17px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--fg:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--fg:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:300 11px/1.4 "Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;padding:0 16px 48px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--fg);padding:4px 8px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;border-radius:0;line-height:1.3;white-space:nowrap}
button.on{background:var(--fg);color:var(--bg)}
button:active{background:var(--fg);color:var(--bg)}
button:disabled{cursor:default;text-decoration:line-through}
:focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
input{font:inherit;color:var(--fg);background:var(--bg);border:0;border-bottom:1px solid var(--fg);border-radius:0;padding:1px 2px;outline:none;width:100%}
.u{text-transform:uppercase;letter-spacing:.09em}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px;border-bottom:1px solid var(--fg)}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp>.cap{text-transform:uppercase;letter-spacing:.12em;margin-right:2px}
.seg{display:flex}
.seg button+button{border-left:0}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:6px}
.brand b{font-weight:600;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.brand span{letter-spacing:.1em;text-transform:uppercase;font-size:10px}
#scope{width:180px;height:34px;border:1px solid var(--fg);display:block}
.spacer{flex:1}
.status{min-width:12ch}

/* line slider */
.p{display:grid;grid-template-columns:1fr auto;column-gap:8px;cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none;padding-block:3px 1px;min-width:0}
.p .l{text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .v{font-variant-numeric:tabular-nums;cursor:text;white-space:nowrap}
.p .v input{width:8ch;text-align:right;padding:0}
.p .t{grid-column:1/-1;height:9px;position:relative}
.p .t::before{content:"";position:absolute;left:0;right:0;top:4px;border-top:1px dotted var(--fg)}
.p .t b{position:absolute;top:4px;border-top:1px solid var(--fg);height:0}
.p .t i{position:absolute;top:0;width:1px;height:9px;background:var(--fg);margin-left:-.5px}
.p.dis .l{text-decoration:line-through}
.p.inline{width:150px}

/* knob */
.knob{display:flex;align-items:center;gap:6px;cursor:ns-resize;user-select:none;-webkit-user-select:none;touch-action:none}
.knob svg{display:block;overflow:visible}
.knob .kv{display:flex;flex-direction:column;line-height:1.25}
.knob .kv b{font-weight:400;font-variant-numeric:tabular-nums;font-size:13px}

/* numeric field */
.num{display:inline-flex;align-items:stretch}
.num button{padding:1px 5px}
.num span{min-width:3.2ch;text-align:center;border-block:1px solid var(--fg);padding:1px 3px;cursor:ns-resize;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;touch-action:none;line-height:1.55}
.num span.fixed{cursor:default}
.num span input{width:3ch;border:0;text-align:center;padding:0}

/* sequencer */
#seq{padding-block:14px 16px;border-bottom:1px solid var(--fg)}
.seqtop{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:12px}
.rows{overflow-x:auto;padding-block:6px 4px}
.row{display:flex;align-items:center;gap:6px;min-width:max-content;padding-block:4px}
.row .name{width:104px;text-align:left;overflow:hidden;text-overflow:ellipsis}
.row .name.sel{outline:1px solid var(--fg);outline-offset:2px}
.row .name.hit{background:var(--fg);color:var(--bg)}
.row .sm{padding:4px 5px;min-width:22px}
.row .sm.arm{border-style:dashed}
.row .sm.pp{padding:4px 5px;display:inline-flex;align-items:center;justify-content:center;height:24px}
.steps{display:flex;margin-left:8px;touch-action:none}
.cell{flex:0 0 var(--cw);height:28px;border:1px solid var(--fg);margin-left:-1px;position:relative;cursor:pointer;background:var(--bg)}
.cell.g{margin-left:5px}
.cell:first-child{margin-left:0}
.cell b{position:absolute;left:0;right:0;bottom:0;background:var(--fg);pointer-events:none}
.cell.now::after{content:"";position:absolute;left:-1px;right:-1px;height:1px;background:var(--fg);bottom:-5px}
.brush button{display:inline-flex;align-items:flex-end;gap:6px}
.brush i{display:inline-block;width:7px;height:10px;border:1px solid currentColor;position:relative}
.brush i::after{content:"";position:absolute;left:0;right:0;bottom:0;background:currentColor;height:var(--h)}
.hint{letter-spacing:.04em;align-self:center}

/* editor */
#editor{padding-block:16px}
.edhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.edhead .nm{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;width:13ch}
.edhead .idx{font-size:15px;letter-spacing:.1em}
.sec{border-top:1px solid var(--fg);padding-top:8px}
.sec>h3{margin:0 0 8px;font:400 10px/1.4 inherit;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:center}
.edgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px}
.pgrid .full{grid-column:1/-1}
.ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.op .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
canvas.env{width:100%;height:54px;display:block;border:1px solid var(--fg);margin-bottom:8px}
.mx{display:grid;grid-template-columns:auto repeat(4,1fr) 12px 1fr;gap:4px;align-items:stretch}
.mx .hd{text-align:center;letter-spacing:.1em;padding-block:2px}
.mx .rh{padding-right:6px;align-self:center;letter-spacing:.1em}
.mc{border:1px dotted var(--fg);height:30px;position:relative;cursor:ns-resize;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mc.nz{border-style:solid}
.mc.fb::before{content:"fb";position:absolute;left:3px;top:1px;font-size:9px;letter-spacing:.05em}
.mc b{position:absolute;left:0;bottom:0;height:1px;background:var(--fg)}
.algs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.algs button{padding:3px 6px;font-size:10px;letter-spacing:.03em;text-transform:none}
.note{margin-top:8px;letter-spacing:.03em}
.tog{display:flex;gap:6px;flex-wrap:wrap}
.ctrlrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

@media (max-width:1100px){.ops{grid-template-columns:repeat(2,minmax(0,1fr))}.edgrid{grid-template-columns:1fr}}
@media (max-width:620px){.ops{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#scope{width:120px}.row .name{width:78px}}
@media (prefers-reduced-motion:reduce){.row .name.hit{background:var(--bg);color:var(--fg);text-decoration:underline}}
</style>

</head>
<body>
<header class="bar" id="top">
  <div class="brand"><b>Strike Eight</b><span>8 × 4-op FM percussion</span></div>
  <div class="grp">
    <button id="play" class="u" style="min-width:64px">Play</button>
    <div id="bpm" class="p inline" style="width:200px" title="Tempo −999 to 999. Negative plays the pattern backwards; 0 holds."></div>
    <button id="snap" class="sm" title="Snap tempo to whole numbers">Snap</button>
    <button id="flip" class="sm" title="Flip direction 90 ↔ −90 (F). While playing it waits for the end of the loop; press again to cancel.">Flip</button>
    <div id="swing" class="p inline"></div>
  </div>
  <div class="grp"><span class="cap">Step</span><div class="seg" id="div"></div></div>
  <div class="grp"><div id="master" class="p inline"></div></div>
  <div class="grp"><span class="cap">Oversample</span><div class="seg" id="os"></div></div>
  <div class="spacer"></div>
  <div class="grp"><canvas id="scope" aria-label="Output oscilloscope"></canvas><span id="fmtinfo" class="status"></span></div>
</header>

<section class="bar">
  <div class="grp"><span class="cap">Randomize</span></div>
  <div class="grp"><button id="rndSounds">Sounds</button><div id="kWild" class="knob"></div></div>
  <div class="grp"><button id="rndBeats">Beats</button><div id="kDens" class="knob"></div></div>
  <div class="grp"><button id="rndBoth">Both</button><button id="undo">Undo</button></div>
  <div class="spacer"></div>
  <div class="grp"><span class="cap">Voices</span><div class="seg" id="vmode"></div></div>
</section>

<section class="bar">
  <div class="grp"><span class="cap">Export WAV</span><span>loops</span><span class="num" id="loops"></span></div>
  <div class="grp"><div class="seg" id="xrate"></div><div class="seg" id="xbits"></div></div>
  <div class="grp"><span>tail</span><div class="seg" id="xtail"></div></div>
  <div class="grp"><button id="export">Render</button><span id="xstat" class="status"></span></div>
  <div class="spacer"></div>
  <div class="grp"><span class="cap">Kit</span><button id="saveKit">Save</button><button id="loadKit">Load</button><input type="file" id="kitFile" accept=".json,application/json" hidden></div>
</section>

<section id="seq">
  <div class="seqtop">
    <div class="grp brush"><span class="cap">Paint</span><div class="seg" id="brush"></div></div>
    <div class="grp"><span class="cap">All lengths</span><span class="num" id="lenAll"></span></div>
    <div class="grp"><button id="clear">Clear pattern</button></div>
    <span class="hint">Click or drag to paint · right-click cycles level · click a name to edit and hear it · space plays</span>
  </div>
  <div class="rows" id="rows"></div>
</section>

<section id="editor"></section>

<script type="text/plain" id="engine-src">// Strike Eight — FM percussion engine (AudioWorklet)
// 64-bit float DSP, 4-operator full-matrix FM, oversampled with Kaiser-windowed FIR decimation,
// sample-accurate sequencer. Sine operators only.
const TAU = Math.PI * 2;
const VEL = [0, 0.2, 0.45, 0.7, 1];
const CR = 16;      // control-rate interval, in oversampled samples
const MAXV = 12;    // voices per track

function i0(x) {
  let s = 1, t = 1;
  for (let k = 1; k < 60; k++) { t *= (x / (2 * k)) * (x / (2 * k)); s += t; if (t < 1e-14 * s) break; }
  return s;
}
function makeFir(os) {
  if (os < 2) return null;
  const taps = 64 * os - 1, M = taps - 1, fc = 0.5 / os, beta = 9, ib = i0(beta);
  const h = new Float64Array(taps);
  let s = 0;
  for (let n = 0; n < taps; n++) {
    const x = n - M / 2;
    const sinc = x === 0 ? 2 * fc : Math.sin(TAU * fc * x) / (Math.PI * x);
    const r = 2 * n / M - 1;
    h[n] = sinc * i0(beta * Math.sqrt(Math.max(0, 1 - r * r))) / ib;
    s += h[n];
  }
  for (let n = 0; n < taps; n++) h[n] /= s;
  return h;
}
function envAt(op, t, ds) {
  const a = op.a;
  if (t < a) return t / a;
  t -= a;
  if (t < op.h) return 1;
  t -= op.h;
  const k = Math.pow(2, op.curve * 3), br = op.brk;
  const d1 = Math.max(0.05, op.d1 * ds);
  if (t < d1) return br + (1 - br) * Math.pow(1 - t / d1, k);
  t -= d1;
  const d2 = Math.max(0.05, op.d2 * ds);
  if (t < d2) return br * Math.pow(1 - t / d2, k);
  return 0;
}

class Voice {
  constructor() {
    this.on = false; this.fading = false; this.g = 1; this.gd = 0;
    this.t = 0; this.cr = 0; this.tr = 0; this.vel = 1; this.age = 0; this.amp = 1;
    this.rp = 1; this.ri = 1; this.end = 0;
    this.ph = new Float64Array(4); this.inc = new Float64Array(4);
    this.env = new Float64Array(4); this.einc = new Float64Array(4);
    this.og = new Float64Array(4); this.o = new Float64Array(4);
    this.cur = new Float64Array(4); this.y1 = new Float64Array(4); this.y2 = new Float64Array(4);
    this.m = new Float64Array(16);
  }
}

class FM8 extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const o = (options && options.processorOptions) || {};
    this.st = null;
    this.os = 0;
    this.vox = [];
    for (let t = 0; t < 8; t++) { const a = []; for (let q = 0; q < MAXV; q++) a.push(new Voice()); this.vox.push(a); }
    this.gL = new Float64Array(8); this.gR = new Float64Array(8);
    this.dcx = [0, 0]; this.dcy = [0, 0]; this.dcR = 1 - TAU * 5 / sampleRate;
    this.clock = 0; this.ageCtr = 0;
    this.playing = false; this.pos = 0; this.nk = 0; this.pk = 0; this.fired = 0; this.flipArm = false; this.flips = 0;
    this.offline = !!o.offline; this.maxSteps = o.maxSteps || 0;
    this.pending = [];
    // lookahead peak limiter (1.5 ms, ceiling -0.3 dBFS)
    this.laN = Math.max(8, Math.round(sampleRate * 0.0015));
    this.ceil = Math.pow(10, -0.3 / 20);
    this.dlL = new Float64Array(this.laN); this.dlR = new Float64Array(this.laN); this.dlp = 0;
    const qs = this.laN + 4; this.qV = new Float64Array(qs); this.qI = new Float64Array(qs); this.qH = 0; this.qT = 0; this.qS = qs;
    this.li = 0; this.lg = 1;
    this.att = 1 - Math.exp(-1 / (this.laN / 5)); this.rel = 1 - Math.exp(-1 / (sampleRate * 0.08));
    this.tdir = new Int8Array(8).fill(1); this.tk0 = new Float64Array(8); this.ti0 = new Float64Array(8);
    this.tlastI = new Int32Array(8); this.tlastK = new Float64Array(8); this.thas = new Uint8Array(8); this.revArm = new Uint8Array(8); this.tpp = new Uint8Array(8);
    this.pend = null; this.lastPend = null; this.randSeq = 0;
    this.idxOut = new Array(8).fill(0);
    this.osOverride = o.os || 0;
    if (o.state) this.setState(o.state);
    if (o.play) this.start();
    this.port.onmessage = (e) => this.onMsg(e.data);
  }
  setOS(os) {
    os = Math.max(1, Math.min(4, os | 0));
    if (os === this.os) return;
    this.os = os; this.osr = sampleRate * os; this.fir = makeFir(os);
    const n = this.fir ? this.fir.length : 1;
    this.taps = n; this.fL = new Float64Array(n * 2); this.fR = new Float64Array(n * 2); this.fi = 0;
    for (const vs of this.vox) for (const v of vs) v.on = false;
  }
  setState(s) {
    // a bar-synced flip may have happened after the UI sent this state: keep the engine's direction
    const d = this.flips - (s.flipSeq || 0);
    if (d > 0 && (d & 1)) s.bpm = -s.bpm;
    // a queued randomization may have landed after the UI sent this state: keep it
    if ((s.randSeq || 0) < this.randSeq && this.lastPend) this.merge(s, this.lastPend);
    this.st = s;
    this.setOS(this.osOverride || s.os || 2);
    this.setGains(s);
  }
  merge(s, pend) {
    for (let t = 0; t < 8; t++) if (pend[t]) Object.assign(s.tracks[t], JSON.parse(JSON.stringify(pend[t])));
  }
  setGains(s) {
    for (let t = 0; t < 8; t++) {
      const tr = s.tracks[t];
      const p = Math.max(-1, Math.min(1, tr.pan));
      const ang = (p + 1) * Math.PI / 4;
      this.gL[t] = Math.cos(ang) * Math.SQRT2 * tr.lvl;
      this.gR[t] = Math.sin(ang) * Math.SQRT2 * tr.lvl;
    }
  }
  start() {
    // transport position is measured in steps and may run backwards (negative tempo)
    this.playing = true; this.pos = 0; this.nk = 0; this.pk = 0; this.fired = 0; this.flipArm = false;
    // per-track direction: index(k) = i0 + dir * (k - k0), wrapped to the track length
    for (let t = 0; t < 8; t++) {
      const tr = this.st.tracks[t], len = Math.max(1, Math.min(64, tr.len | 0)), rev = !!tr.rev;
      this.tdir[t] = rev ? -1 : 1; this.tk0[t] = 0; this.ti0[t] = rev ? len - 1 : 0; this.tpp[t] = tr.pp ? 1 : 0;
      this.thas[t] = 0; this.revArm[t] = 0;
    }
  }
  onMsg(d) {
    if (d.type === 'state') this.setState(d.state);
    else if (d.type === 'play') this.start();
    else if (d.type === 'stop') { this.playing = false; this.flipArm = false; this.revArm.fill(0); this.pend = null; }
    else if (d.type === 'flipArm') this.flipArm = !!d.on;
    else if (d.type === 'revArm') this.revArm[d.t] = d.on ? 1 : 0;
    else if (d.type === 'pending') this.pend = d.tracks || null;
    else if (d.type === 'trig') this.pending.push(d);
    else if (d.type === 'panic') { for (const vs of this.vox) for (const v of vs) v.on = false; }
  }
  fade(v, ms) {
    if (!v.on || v.fading) return;
    v.fading = true;
    v.gd = v.g / Math.max(1, ms * this.osr / 1000);
  }
  cutAll() {
    // global cut: fade every voice still sounding from an earlier moment
    for (let t = 0; t < 8; t++) { const f = this.st.tracks[t].fade; for (const v of this.vox[t]) this.fade(v, f); }
  }
  trigger(ti, vel) {
    const st = this.st, tr = st.tracks[ti];
    if (!tr) return;
    const mode = st.voiceMode || 'track';
    if (mode === 'track' && tr.choke > 0) {
      for (let t2 = 0; t2 < 8; t2++) {
        if (t2 === ti || st.tracks[t2].choke !== tr.choke) continue;
        for (const v of this.vox[t2]) this.fade(v, st.tracks[t2].fade);
      }
    }
    const vs = this.vox[ti];
    if (mode === 'track' && tr.cut) for (const v of vs) this.fade(v, tr.fade);
    let v = null;
    for (const x of vs) if (!x.on) { v = x; break; }
    if (!v) { v = vs[0]; for (const x of vs) if (x.age < v.age) v = x; }
    v.on = true; v.fading = false; v.g = 1; v.gd = 0; v.t = 0; v.cr = 0; v.tr = ti; v.vel = vel;
    v.age = this.ageCtr++;
    v.rp = Math.pow(2, (Math.random() * 2 - 1) * tr.rndPitch / 1200);
    v.ri = Math.max(0, 1 + (Math.random() * 2 - 1) * tr.rndTone);
    for (let i = 0; i < 4; i++) {
      v.ph[i] = tr.ops[i].phase; v.y1[i] = 0; v.y2[i] = 0; v.cur[i] = 0; v.env[i] = 0; v.einc[i] = 0;
    }
  }
  ctrl(v) {
    const tr = this.st.tracks[v.tr];
    const msPer = 1000 / this.osr;
    const t0 = v.t * msPer, t1 = (v.t + CR) * msPer;
    const ds = tr.decS, n = Math.max(1, tr.strikes | 0), sp = Math.max(0.1, tr.space);
    // voice end: last strike + longest audible carrier envelope
    let longest = 0;
    for (let i = 0; i < 4; i++) {
      if (tr.out[i] <= 0) continue;
      const op = tr.ops[i];
      const L = op.a + op.h + (op.d1 + op.d2) * ds;
      if (L > longest) longest = L;
    }
    if (t0 > (n - 1) * sp + longest + 1) { v.on = false; return; }
    const lt = (t) => { const k = Math.min(n - 1, Math.floor(t / sp)); const tl = t - k * sp; return k < n - 1 ? tl * 3 : tl; };
    const l0 = lt(t0), l1 = lt(t1);
    const vel = v.vel;
    const vi = (1 - tr.velIdx * (1 - vel)) * tr.idx * v.ri;
    const tm = (t0 + t1) * 0.5;
    const semis = tm < tr.pDec ? tr.pAmt * Math.pow(1 - tm / tr.pDec, Math.pow(2, tr.pCurve * 3)) : 0;
    const base = tr.note * v.rp;
    const lim = this.osr * 0.45;
    for (let i = 0; i < 4; i++) {
      const op = tr.ops[i];
      const e0 = envAt(op, l0, ds), e1 = envAt(op, l1, ds);
      v.env[i] = e0; v.einc[i] = (e1 - e0) / CR;
      v.og[i] = op.lvl * (1 - op.vel * (1 - vel));
      const pm = Math.pow(2, semis * op.pe / 12);
      let f = op.fixed ? op.hz * pm : base * op.ratio * Math.pow(2, op.fine / 1200) * pm + op.det;
      if (f > lim) f = lim; else if (f < -lim) f = -lim;
      v.inc[i] = f / this.osr;
      v.o[i] = tr.out[i];
      const row = tr.mx[i];
      for (let j = 0; j < 4; j++) v.m[i * 4 + j] = row[j] * vi;
    }
    v.amp = 1 - tr.velAmp * (1 - vel);

const ROLE_DENS = { kick: 0.75, snare: 0.5, hat: 1.55, ohat: 0.55, tom: 0.45, clap: 0.45, rim: 0.7, bell: 0.5, zap: 0.45, metal: 0.6, perc: 0.8, noise: 0.8 };

  const d = dens / 100, len = tr.len, rf = ROLE_DENS[tr.role] || 0.8;

    if ((tr.role === 'snare' || tr.role === 'clap') && i % (beat * 2) === beat) w *= 2.6;
    if (tr.role === 'kick' && i % (beat * 2) === beat) w *= 0.45;

/* ---------- global actions ---------- */
function renderAll() { renderSeq(); renderEditor(); sync(); }
$('#play').onclick = togglePlay;
// While playing, randomizing is prepared now and lands on the first step of the next loop.
const pend = { sounds: null, beats: null };
const TRACK_KEEP = ['steps', 'len', 'mute', 'solo', 'rev', 'pp'];
function makeSounds() {
  return state.tracks.map(tr => {
    const c = JSON.parse(JSON.stringify(tr)); randomizeInst(c, wild / 100);
    TRACK_KEEP.forEach(k => delete c[k]); return c;

}
function makeBeats(roles) {

}
function paintRnd() {

}
function sendPend() {

}
function landPend(seq) {

  state.tracks.forEach((tr, t) => {
    if (pend.sounds) Object.assign(tr, JSON.parse(JSON.stringify(pend.sounds[t])));
    if (pend.beats) tr.steps = pend.beats[t].slice();

  pend.sounds = pend.beats = null; paintRnd(); renderAll();
}
function clearPend() { pend.sounds = pend.beats = null; if (node) node.port.postMessage({ type: 'pending', tracks: null }); paintRnd(); }
$('#rndSounds').onclick = () => {
  if (!(playing && node)) { pushUndo(); state.tracks.forEach(t => randomizeInst(t, wild / 100)); renderAll(); return; }
  pend.sounds = pend.sounds ? null : makeSounds(); sendPend();
};
$('#rndBeats').onclick = () => {
  if (!(playing && node)) { pushUndo(); state.tracks.forEach(t => genRhythm(t, density)); renderAll(); return; }

$('#rndBoth').onclick = () => {
  if (!(playing && node)) { pushUndo(); state.tracks.forEach(t => { randomizeInst(t, wild / 100); genRhythm(t, density); }); renderAll(); return; }
  if (pend.sounds && pend.beats) { pend.sounds = pend.beats = null; }
  else { if (!pend.sounds) pend.sounds = makeSounds(); if (!pend.beats) pend.beats = makeBeats(pend.sounds.map(p => p.role)); }

};
$('#undo').disabled = true;
$('#undo').onclick = () => {
  const s = undoStack.pop(); if (!s) return;
  const o = normalize(JSON.parse(s)); state.tracks = o.tracks;
  $('#undo').disabled = !undoStack.length; renderAll();
};
function renderVMode() {
  seg($('#vmode'), [['cut', 'All cut'], ['poly', 'All poly'], ['track', 'Per track']], () => state.voiceMode, v => { state.voiceMode = v; renderSeq(); renderEditor(); sync(); });
  $('#vmode').title = 'All cut: any new step cuts everything still ringing (same-step hits play together). All poly: every hit rings out fully, no chokes. Per track: each track\'s own Cut/Poly and choke group.';
}
const effCut = tr => state.voiceMode === 'track' ? tr.cut : state.voiceMode === 'cut';
$('#clear').onclick = () => { pushUndo(); state.tracks.forEach(t => t.steps.fill(0)); renderAll(); };
knob($('#kWild'), 'Wild', () => wild, v => wild = v, v => v + '%');
knob($('#kDens'), 'Density', () => density, v => density = v, v => v + '%');
let lenAll = 7;
numField($('#lenAll'), () => lenAll, v => { lenAll = v; state.tracks.forEach(t => t.len = v); state.tracks.forEach((t, i) => buildSteps(i)); renderSeq(); sync(); }, 1, 64, 'All lengths', true);
numField($('#loops'), () => xp.loops, v => xp.loops = v, 1, 64, 'Loops');
seg($('#xrate'), [[44100, '44.1k'], [48000, '48k'], [96000, '96k']], () => xp.rate, v => xp.rate = v);
seg($('#xbits'), [[16, '16'], [24, '24'], [32, '32f']], () => xp.bits, v => xp.bits = v);
seg($('#xtail'), [['cut', 'cut'], ['ring', 'ring'], ['wrap', 'wrap']], () => xp.tail, v => xp.tail = v);
$('#xtail').title = 'cut: exact loop length · ring: let the last hits decay · wrap: fold the decay into the start for seamless looping';

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyF' && !e.metaKey && !e.ctrlKey && !e.altKey) $('#flip').click();
  else if (/^Digit[1-8]$/.test(e.code) && !e.metaKey && !e.ctrlKey && !e.altKey) { const i = +e.code.slice(5) - 1; select(i); audition(i, brush); }
});

/* ---------- animation: playhead + scope ---------- */
let scopeBuf = null;
function frame() {
  if (ctx) {
    const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
    const heard = ts && ts.contextTime ? ts.contextTime : ctx.currentTime - (ctx.outputLatency || 0) - (ctx.baseLatency || 0);
    let last = null;
    while (stepQ.length && stepQ[0].t <= heard + 0.004) last = stepQ.shift();
    if (last && playing) showStep(last.idx);
    if (an) {
      const cv = $('#scope');
      const { g, w, h } = prepCanvas(cv);
      if (!scopeBuf) scopeBuf = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(scopeBuf);
      let z = 0; for (let i = 1; i < scopeBuf.length / 2; i++) if (scopeBuf[i - 1] <= 0 && scopeBuf[i] > 0) { z = i; break; }
      const N = scopeBuf.length / 2;
      g.beginPath();
      for (let x = 0; x < w; x++) { const s = scopeBuf[z + Math.floor(x / w * N)] || 0; const y = h / 2 - s * h * 0.46; x ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- export ---------- */
function tailSeconds() {
  let m = 0;
  state.tracks.forEach(tr => {
    const n = Math.max(1, tr.strikes);
    tr.ops.forEach((op, i) => { if (tr.out[i] > 0) m = Math.max(m, (n - 1) * tr.space + op.a + op.h + (op.d1 + op.d2) * tr.decS); });
  });
  return Math.min(20, m / 1000 + 0.05);
}
function loopSteps() { return Math.max(...state.tracks.map(t => t.len)); }
function encodeWav(chs, sr, bits) {
  const n = chs[0].length, nc = chs.length, bps = bits / 8, isF = bits === 32;

  const buf = new ArrayBuffer(hdr + dataLen), dv = new DataView(buf);
  let p = 0; const s4 = s => { for (let i = 0; i < 4; i++) dv.setUint8(p++, s.charCodeAt(i)); };
  const u32 = v => { dv.setUint32(p, v, true); p += 4; }, u16 = v => { dv.setUint16(p, v, true); p += 2; };

  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

  ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true);
  ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true);

let dl = null;
const dlReady = (async () => { try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; } })();
async function offerFile(filename, blob, alt) {
  await dlReady;

    try { await dl.save({ filename, data: blob }); return 'saved'; }
    catch (e) {
      if (e && (e.code === 'rejected_extension' || e.code === 'extension_not_enabled') && alt) {
        try { await dl.save({ filename: alt.filename, data: alt.blob }); return 'zipped'; }
        catch (e2) { if (e2 && e2.code === 'declined') return 'declined'; if (e2 && e2.code === 'rate_limited') return 'busy'; }
      }
      if (e && e.code === 'declined') return 'declined'; if (e && e.code === 'rate_limited') return 'busy';
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  return 'saved';
}
$('#export').onclick = async () => {
  const stat = $('#xstat'), btn = $('#export');
  btn.disabled = true; stat.textContent = 'rendering…';
  try {
    if (Math.abs(state.bpm) < 0.01) { stat.textContent = 'tempo is 0 — nothing to render'; btn.disabled = false; return; }
    const sr = xp.rate, steps = loopSteps() * xp.loops;
    const stepSec = 60 / (Math.abs(state.bpm) * state.spb);
    const loopLen = Math.round(steps * stepSec * sr);
    const tail = xp.tail === 'cut' ? 0 : Math.round(tailSeconds() * sr);
    const off = new OfflineAudioContext(2, loopLen + tail, sr);
    if (!engineURL) engineURL = await loadWorklet(off.audioWorklet); else await off.audioWorklet.addModule(engineURL);
    const st = JSON.parse(JSON.stringify(state));
    const os = sr >= 88200 ? 2 : 4;
    const n = new AudioWorkletNode(off, 'fm8', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { state: st, os, offline: true, play: true, maxSteps: steps } });

    const buf = await off.startRendering();
    let L = buf.getChannelData(0), Rr = buf.getChannelData(1);

      for (let i = 0; i < L.length; i++) { const j = i % loopLen; l2[j] += L[i]; r2[j] += Rr[i]; }
      L = l2; Rr = r2;
    }
    const wav = encodeWav([L, Rr], sr, xp.bits);
    const base = `strike-eight_${Math.round(state.bpm)}bpm_${xp.loops}x${loopSteps()}_${sr / 1000}k_${xp.bits === 32 ? '32f' : xp.bits}`;
    stat.textContent = 'saving…';
    const r = await offerFile(base + '.wav', new Blob([wav], { type: 'audio/wav' }), { filename: base + '.zip', blob: zipStore(base + '.wav', wav) });
    const mb = (wav.length / 1048576).toFixed(1) + 'MB';
    stat.textContent = r === 'saved' ? 'saved ' + mb + ' wav' : r === 'zipped' ? 'saved ' + mb + ' wav (zipped)' : r === 'declined' ? 'save declined' : 'try again in a moment';
  } catch (e) {
    stat.textContent = 'render failed — ' + (e && e.message ? e.message : 'unknown');
  }
  btn.disabled = false;
};
$('#saveKit').onclick = async () => {
  const r = await offerFile('strike-eight-kit.json', new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }));
  $('#xstat').textContent = r === 'saved' ? 'kit saved' : r === 'declined' ? 'save declined' : '';
};
$('#loadKit').onclick = () => $('#kitFile').click();
$('#kitFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = normalize(JSON.parse(await f.text())); pushUndo(); state = s; renderHeader(); renderVMode(); renderAll(); $('#xstat').textContent = 'kit loaded'; }
  catch (err) { $('#xstat').textContent = 'not a Strike Eight kit file'; }
  e.target.value = '';
};

/* ---------- boot ---------- */
renderHeader(); renderVMode(); renderBrush(); renderSeq(); renderEditor();
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawPitch(); for (let i = 0; i < 4; i++) drawEnv(i); }, 100); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { drawPitch(); for (let i = 0; i < 4; i++) drawEnv(i); });
new MutationObserver(() => { drawPitch(); for (let i = 0; i < 4; i++) drawEnv(i); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
